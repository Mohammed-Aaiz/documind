<style>
        .input-glow:focus {
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.5);
            border-bottom-color: #8B5CF6;
        }
        
        .panel-glow {
            box-shadow: 0 0 60px rgba(139, 92, 246, 0.15);
        }
        
        .bg-glass {
            background-color: rgba(5, 7, 10, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }

        .border-glass-top-left {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Shimmer animation for button */
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: translateX(-100%);
        }
        .shimmer-btn:hover::after {
            animation: shimmer 1.5s infinite;
        }
    </style>
</head>
<body class="bg-void-black text-on-surface h-screen w-screen overflow-hidden flex items-center justify-center relative font-body-base">
<!-- Cosmic Background Shader -->
<div class="absolute inset-0 z-0">

</div>
<!-- 3D Core Centerpiece Background (Optional overlay if separate from shader) -->
<div class="absolute inset-0 z-0 opacity-40 pointer-events-none">

</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[500px] mx-gutter px-gutter">
<!-- Header Section -->
<header class="text-center mb-12">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-4">
                DOCUMIND: <span class="bg-clip-text text-transparent bg-gradient-to-r from-electric-violet to-cyber-cyan">NEURAL AUTH CORE</span>
</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant tracking-wider uppercase">
                Establish connection to the intelligence cluster
            </p>
</header>
<!-- Glass Panel -->
<div class="bg-glass rounded-xl border-glass-top-left border-r border-b border-transparent panel-glow p-12 relative overflow-hidden">
<!-- Form -->
<form action="#" class="flex flex-col gap-8" method="POST">
<!-- Identity Matrix (Email) -->
<div class="relative group">
<label class="font-label-code text-label-code text-electric-violet mb-2 block uppercase tracking-widest" for="identity">
                        Identity Matrix
                    </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline group-focus-within:text-electric-violet transition-colors">
                            fingerprint
                        </span>
<input class="w-full bg-transparent border-0 border-b border-outline-variant pl-8 py-3 text-on-surface font-body-base focus:ring-0 input-glow transition-all duration-300 placeholder-outline/50" id="identity" name="identity" placeholder="Enter credentials..." required="" type="email"/>
</div>
</div>
<!-- Access Cipher (Password) -->
<div class="relative group">
<label class="font-label-code text-label-code text-electric-violet mb-2 block uppercase tracking-widest flex justify-between" for="cipher">
                        Access Cipher
                        <a class="text-cyber-cyan hover:text-secondary transition-colors" href="#">Override?</a>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-outline group-focus-within:text-electric-violet transition-colors">
                            key
                        </span>
<input class="w-full bg-transparent border-0 border-b border-outline-variant pl-8 py-3 text-on-surface font-body-base focus:ring-0 input-glow transition-all duration-300 placeholder-outline/50" id="cipher" name="cipher" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="mt-6 w-full py-4 rounded-lg bg-gradient-to-r from-electric-violet to-primary-container text-on-primary font-label-caps text-label-caps font-bold tracking-[0.2em] uppercase hover:shadow-[0_0_30px_rgba(139,92,246,0.4)] transition-all duration-300 relative overflow-hidden shimmer-btn group" type="submit">
<span class="relative z-10 flex items-center justify-center gap-2">
                        Initialize Connection
                        <span class="material-symbols-outlined text-[16px] group-hover:translate-x-1 transition-transform">
                            arrow_forward
                        </span>
</span>
</button>
</form>
<!-- Edge Light Accent -->
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-electric-violet/50 to-transparent"></div>
</div>
<!-- Footer Links -->
<div class="mt-8 text-center flex justify-center gap-6">
<a class="font-label-code text-label-code text-outline hover:text-cyber-cyan transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[14px]">policy</span>
                Protocols
            </a>
<a class="font-label-code text-label-code text-outline hover:text-cyber-cyan transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[14px]">support_agent</span>
                Support
            </a>
</div>
</main>
<script>
        // Micro-interaction for inputs to add a subtle glow effect on the container based on mouse position (optional flair)
        const panel = document.querySelector('.bg-glass');
        
        panel.addEventListener('mousemove', (e) => {
            const rect = panel.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            panel.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(139, 92, 246, 0.05), rgba(5, 7, 10, 0.7) 40%)`;
        });

        panel.addEventListener('mouseleave', () => {
            panel.style.background = 'rgba(5, 7, 10, 0.7)';
        });
    </script>
</body></html>
