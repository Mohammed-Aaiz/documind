[pytest]
asyncio_mode = auto

# ---------------------------------------------------------------------------
# Explicit discovery (DocuMind test-isolation contract, §7)
#
# Only `backend/tests/` is scanned.  The backend is never scanned recursively,
# so production packages (auth/, chat/, documents/, embeddings/, brain/,
# graph/, …) and research code (evaluation/) can never be collected as tests.
# ---------------------------------------------------------------------------
testpaths = tests
python_files = test_*.py *_test.py

markers =
    e2e: live-server end-to-end test (needs a running backend at the recorded base URL; skipped when unreachable)
